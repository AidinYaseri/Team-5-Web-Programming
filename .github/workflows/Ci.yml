name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # Must match <TargetFramework> in the .csproj files (net10.0)
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Team-5-Web-Programming.slnx

      - name: Build
        run: dotnet build Team-5-Web-Programming.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Team-5-Web-Programming.slnx --no-build --configuration Release --verbosity normal

      # Run migration verification only when EF Core packages are present.
      - name: Verify EF Core migrations
        run: |
          if grep -Rqs "Microsoft.EntityFrameworkCore" src --include="*.csproj"; then
            dotnet tool install --global dotnet-ef --version 10.*
            export PATH="$PATH:$HOME/.dotnet/tools"
            dotnet ef migrations script --idempotent --configuration Release --output migrations.sql --project src/Animal.Data/Animal.Data.csproj --startup-project src/Animal.API/Animal.API.csproj
          else
            echo "No EF Core package references found; skipping migration verification."
          fi
