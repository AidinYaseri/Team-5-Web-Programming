name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # Match this to the <TargetFramework> in your .csproj (net8.0 -> 8.0.x, net9.0 -> 9.0.x)
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Run migration verification only when EF Core packages are present.
      - name: Verify EF Core migrations
        run: |
          if grep -Rqs "Microsoft.EntityFrameworkCore" . --include="*.csproj"; then
            dotnet tool install --global dotnet-ef --version 8.*
            export PATH="$PATH:$HOME/.dotnet/tools"
            dotnet ef migrations script --idempotent --configuration Release --output migrations.sql --project Animal.Data/Animal.Data.csproj --startup-project Animal.API/Animal.API.csproj
          else
            echo "No EF Core package references found; skipping migration verification."
          fi
