# Local identity provider for development only (WI-2, decision D1 in docs/milestone-4/decisions.md).
# Start:  docker compose -f keycloak/docker-compose.yml up -d
# Guide:  docs/milestone-4/identity-provider-setup.md
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: animal-keycloak
    # Dev mode: plain http and an in-container database. Never use this setup outside a developer machine.
    # --import-realm loads animal-realm.json the first time; an existing realm is left as it is.
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # From keycloak/.env (gitignored). Copy .env.example to .env and choose your own password.
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in keycloak/.env}
    ports:
      - "8080:8080"
    volumes:
      - ./animal-realm.json:/opt/keycloak/data/import/animal-realm.json:ro
